name: BartaGuard
options:
  bundleIdPrefix: com.rashidazraf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  BartaGuardCore:
    path: BartaGuardCore
targets:
  BartaGuard:
    type: application
    platform: iOS
    sources: [BartaGuard, Shared]
    dependencies:
      - package: BartaGuardCore
      - target: MessageFilter
      - target: ShareExtension
    info:
      path: BartaGuard/Info.plist
      properties:
        CFBundleDisplayName: BartaGuard
        CFBundleDevelopmentRegion: bn
        CFBundleLocalizations: [bn, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.rashidazraf.bartaguard
            CFBundleURLSchemes: [bartaguard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashidazraf.bartaguard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
  MessageFilter:
    type: app-extension
    platform: iOS
    sources: [MessageFilter]
    dependencies:
      - package: BartaGuardCore
      - sdk: IdentityLookup.framework
    info:
      path: MessageFilter/Info.plist
      properties:
        CFBundleDisplayName: BartaGuard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashidazraf.bartaguard.messagefilter
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    dependencies:
      - package: BartaGuardCore
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: BartaGuard
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashidazraf.bartaguard.share
schemes:
  BartaGuard:
    build:
      targets:
        BartaGuard: all
    test:
      targets: []
